<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris - Sistema de Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Solaris</h1>
        <p>Sistema de Gestión de Inventario</p>
    </header>

    <main class="container">
        <!-- Formulario de Producto -->
        <section class="card">
            <h2 id="form-title">Registrar Nuevo Producto</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" required placeholder="Ej. Laptop Pro">
                </div>

                <div class="form-group">
                    <label for="price">Precio ($):</label>
                    <input type="number" id="price" step="0.01" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="category">Categoría:</label>
                    <input type="text" id="category" required placeholder="Ej. Hardware">
                </div>

                <div class="form-group">
                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" required placeholder="0">
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn btn-primary">Guardar Producto</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary" style="display:none;">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Listado de Productos -->
        <section class="card">
            <h2>Inventario de Productos</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        <!-- Los productos se cargan dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
